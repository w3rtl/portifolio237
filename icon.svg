<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B4C3CC"/>
      <stop offset="0.45" stop-color="#F2A53A"/>
      <stop offset="1" stop-color="#D8490C"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="1" r="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#D8490C" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#D8490C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="102" ry="102"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#warm)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black','Archivo',system-ui,sans-serif" font-weight="900"
        font-size="340" fill="#FBF7EF">P</text>
</svg>
